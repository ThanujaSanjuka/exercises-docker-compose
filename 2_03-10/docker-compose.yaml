
services:
  frontend:
    image: thanuja003/example-frontend:latest
    ports:
      - "5001:5001"

  backend:
    image: thanuja003/example-backend:latest
    ports:
      - "8080:8080"
    environment:
      - REQUEST_ORIGIN=http://localhost:5001
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=postgres
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine

  postgres:
    image: postgres:18
    environment:
      - POSTGRES_PASSWORD=postgres
    restart: unless-stopped
