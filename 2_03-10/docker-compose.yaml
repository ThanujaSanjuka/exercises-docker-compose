
services:
  frontend:
    image: thanuja003/example-frontend:latest
    ports:
      - "5001:5001"

  backend:
    image: thanuja003/example-backend:latest
    ports:
      - "8080:8080"
    environment:
      - REQUEST_ORIGIN=http://localhost:5001
      - REDIS_HOST=redis
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
